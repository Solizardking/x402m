[project]
name = "musebook-x402m"
version = "0.1.0"
description = "Experimental Musebook x402m Agent Auth client and Solana payment composition"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["httpx>=0.28.1,<1", "cryptography>=44,<47"]
[project.urls]
Homepage = "https://musebook.trade/x402"
Repository = "https://github.com/Solizardking/x402m"
[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/x402m"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
